backend = "glx";
vsync = true;

# 1. Configure the core blur parameters
blur: {
  method = "dual_kawase";
  strength = 6;
}

# 2. Hard-restrict blur ONLY to Kitty windows
blur-background-rules = [
  "100:class_g = 'kitty'"
];

# 3. Completely disable background blurring globally by default
blur-background = false;

